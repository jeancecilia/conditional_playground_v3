name: CBT explicit live core flows R4

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: cbt-live-core-r4-${{ github.ref }}
  cancel-in-progress: true

jobs:
  flows:
    name: Central flows — desktop and mobile
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Complete all central user journeys on the deployed Workers application
        run: npx playwright test tests/explicit-core-flows-r4.spec.js --project=desktop --project=mobile --workers=2
      - name: Upload screenshots, videos, traces and JSON results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r4-explicit-core-flows
          retention-days: 7
          if-no-files-found: warn
          path: |
            playwright-report
            test-results
