name: CBT public live audit R5

on:
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  public:
    name: Public pages, CTAs and text scaling
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - name: Test public deployment on desktop and mobile
        run: npx playwright test tests/public-r5.spec.js --project=desktop --project=mobile --workers=2
      - name: Upload public audit evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: r5-public
          retention-days: 7
          if-no-files-found: warn
          path: |
            playwright-report
            test-results
